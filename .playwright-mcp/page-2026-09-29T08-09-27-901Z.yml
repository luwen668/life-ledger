      - heading "外貌描写" [level=1] [ref=f2e12]
      - paragraph [ref=f2e13]: 不写清单写特征，外貌是命运的预告片
      - generic [ref=f2e14]: 品读
    - article [ref=f2e16]:
      - heading "新手最常见的死法：五官清单" [level=3] [ref=f2e17]
      - paragraph [ref=f2e18]:
        - text: “她有一双水汪汪的大眼睛，樱桃小嘴，皮肤白皙，长发及腰。”问题在哪？这段文字删掉任何一个器官都无损，因为没有任何一个字是
        - strong [ref=f2e19]: 这个人
        - text: 的——它描述的是一类人。清单式外貌没有信息量，也没有记忆点。
      - heading "方法一：只写特征，不写全貌" [level=3] [ref=f2e20]
      - paragraph [ref=f2e21]: 真人给人的印象从来不是全套五官，而是两三个字：龅牙、总是歪着的领带、笑得太用力的嘴角。写外貌就像画漫画，抓住两三个变形特征就够了，其余交给读者脑补。读者脑补出的脸，永远比你描写的更贴合他的想象。
      - heading "方法二：用他人的反应侧写" [level=3] [ref=f2e22]
      - paragraph [ref=f2e23]: 与其直接说“她很美”，不如写别人的失态：服务员多看了两眼、相亲对象突然开始整理衬衫。美丑、威仪、亲和力，这些都是社会关系中的属性，借旁人的反应写出来，比形容词可信一百倍。
      - heading "方法三：外貌与命运呼应" [level=3] [ref=f2e24]
      - paragraph [ref=f2e25]: 高级的外貌描写会埋命运线索：常年皱眉留下的川字纹、求人时习惯性弯下的腰、一双“总想看透别人”的眼睛。外貌不是照片，是人物的履历表。多年后读者回想时会说：原来开篇那道疤早就预示了一切。
      - heading "方法四：第一印象加标志性细节" [level=3] [ref=f2e26]
      - paragraph [ref=f2e27]: 人物首次出场只给一次描写机会（详见“人物出场”节点）。此刻要完成两件事：建立第一印象（贵气/寒酸/凶悍），并留下一个可复用的标志性细节——后面每次这个细节重现（手背的烫疤、永远锃亮的皮鞋），都是在不花笔墨地刷新人物存在感。
      - heading "改写示范：前后对比" [level=3] [ref=f2e28]
      - blockquote [ref=f2e29]: 改写前：她很漂亮，有一头乌黑的长发，眼睛很大，身材很好，穿着一条白裙子。改写后：她进门时，整个会议室安静了半秒。长发是标准的黑色——便宜染发膏盖不住白发根的那种黑。白裙子洗得发薄，但熨得极挺。她眼睛很大，大到让你不好意思撒谎。
      - paragraph [ref=f2e30]: 对比要点：改写后每处外貌都携带信息——染发膏说明拮据却要体面，熨得极挺说明自尊，大眼睛从“美”变成功能性细节（让人不敢撒谎，暗示她看穿一切的气场）。外貌描写的本质，是把形容词换成证据。
