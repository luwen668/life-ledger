<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工资个税计算器 · 五险一金各地版</title>
  <meta name="description" content="2025年度十城五险一金 + 个税累计预扣计算，支持年终奖计税对比、税后反推税前" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f1a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%2322d3ee' font-family='monospace'%3E¥%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">¥</span>
      <div>
        <h1>工资个税计算器</h1>
        <p>五险一金 · 十城通用 · <span id="data-year">2025年度</span>口径</p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="salary" role="tab">工资计算</button>
      <button class="tab" data-tab="bonus" role="tab">年终奖</button>
      <button class="tab" data-tab="reverse" role="tab">税后反推</button>
      <button class="tab" data-tab="cities" role="tab">城市数据</button>
    </nav>
  </header>

  <main class="layout">
    <!-- ================= 输入面板 ================= -->
    <aside class="panel input-panel">
      <h2 class="panel-title">输入参数</h2>

      <label class="field">
        <span class="field-label">工作城市</span>
        <select id="city" class="input"></select>
      </label>

      <label class="field" id="hukou-field" hidden>
        <span class="field-label">深圳户籍</span>
        <select id="hukou" class="input">
          <option value="no">非深户（单位养老 16%）</option>
          <option value="yes">深户（单位养老 17%）</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">税前月薪（元）</span>
        <input id="salary" type="number" class="input num" value="20000" min="0" step="100" />
      </label>

      <label class="field">
        <span class="field-label">年终奖（元，可选）</span>
        <input id="bonus" type="number" class="input num" value="0" min="0" step="1000" />
      </label>

      <div class="field">
        <span class="field-label">公积金比例 <b id="housing-rate-label" class="accent">12%</b></span>
        <input id="housing-rate" type="range" class="range" min="5" max="12" step="1" value="12" />
      </div>

      <details class="advanced">
        <summary>高级：自定义缴纳基数</summary>
        <label class="field">
          <span class="field-label">社保基数（默认=月薪）</span>
          <input id="social-base" type="number" class="input num" placeholder="留空自动" min="0" />
        </label>
        <label class="field">
          <span class="field-label">公积金基数（默认=月薪）</span>
          <input id="housing-base" type="number" class="input num" placeholder="留空自动" min="0" />
        </label>
        <p class="hint" id="base-range-hint"></p>
      </details>

      <h3 class="sub-title">专项附加扣除（元/月）</h3>
      <div id="special-list" class="special-list"></div>

      <p class="city-note" id="city-note"></p>
    </aside>

    <!-- ================= 结果区 ================= -->
    <section class="results">
      <!-- 工资计算 -->
      <div class="tab-page active" id="page-salary">
        <div class="kpi-grid" id="kpi-grid"></div>
        <div class="panel chart-panel">
          <h2 class="panel-title">全年 12 个月构成 <span class="dim">累计预扣法 · 逐月计算</span></h2>
          <div id="chart" class="chart"></div>
        </div>
        <div class="panel">
          <h2 class="panel-title">逐月明细</h2>
          <div class="table-wrap">
            <table class="table" id="month-table">
              <thead>
                <tr><th>月份</th><th>税前</th><th>五险一金</th><th>当月个税</th><th>税后到手</th><th>累计已预扣</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 年终奖 -->
      <div class="tab-page" id="page-bonus">
        <div class="bonus-compare" id="bonus-compare"></div>
      </div>

      <!-- 税后反推 -->
      <div class="tab-page" id="page-reverse">
        <div class="panel">
          <h2 class="panel-title">税后反推税前</h2>
          <p class="hint">输入你期望的月均到手工资，反推出需要的税前月薪（按当前城市与参数）。</p>
          <div class="reverse-row">
            <input id="target-net" type="number" class="input num" placeholder="目标月均税后，如 15000" min="0" step="100" />
            <button id="reverse-btn" class="btn">反推计算</button>
          </div>
          <div id="reverse-result"></div>
        </div>
      </div>

      <!-- 城市数据 -->
      <div class="tab-page" id="page-cities">
        <div class="panel">
          <h2 class="panel-title">十城五险一金数据 <span class="dim" id="cities-year"></span></h2>
          <div class="table-wrap">
            <table class="table" id="city-table"></table>
          </div>
          <p class="hint" id="city-disclaimer"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>计算结果仅供参考，实际以当地人社局 / 公积金中心及税务机关口径为准 · 每年 7 月各地基数会调整</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="data.js"></script>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
